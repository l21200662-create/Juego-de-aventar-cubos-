<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Lanza Cubos 3D</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/" } }
  </script>
</head>
<body>
  <main class="hud">
    <p class="eyebrow">RETO DE PRECISIÓN</p>
    <h1>Lanza Cubos</h1>
    <p class="hint">Espera a que el blanco móvil cruce la torre y lanza en el momento justo.</p>
    <div class="stats"><span>PUNTOS <b id="score">0</b></span><span>RÉCORD <b id="best">0</b></span></div>
    <button id="throw-button" type="button">Lanzar cubo <kbd>ESPACIO</kbd></button>
    <p id="message" aria-live="polite">¡Prepárate para lanzar!</p>
    <p class="small">El blanco acelera y el margen se reduce cada 3 aciertos. En VR, usa el gatillo.</p>
  </main>
  <div id="scene" aria-label="Juego 3D de lanzar cubos"></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
